<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Brief</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --ink: #111111;
    --ink-2: #444444;
    --ink-3: #888888;
    --paper: #f5f4f0;
    --white: #ffffff;
    --red: #c0392b;
    --red-light: #fef2f2;
    --border: #e2e0da;
    --shadow: 0 1px 3px rgba(0,0,0,0.07), 0 4px 12px rgba(0,0,0,0.05);
  }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
    font-size: 15px;
    line-height: 1.6;
  }

  /* ── Masthead ── */
  .masthead {
    border-bottom: 3px solid var(--ink);
    background: var(--white);
    padding: 0 clamp(16px, 5vw, 80px);
  }

  .masthead-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 0 12px;
    border-bottom: 1px solid var(--border);
    gap: 12px;
  }

  .masthead-date {
    font-size: 12px;
    color: var(--ink-3);
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  .masthead-logo {
    font-family: 'Playfair Display', serif;
    font-size: clamp(28px, 5vw, 48px);
    font-weight: 900;
    letter-spacing: -0.02em;
    color: var(--ink);
    text-align: center;
    flex: 1;
    line-height: 1;
  }

  .masthead-logo span {
    color: var(--red);
  }

  .masthead-tagline {
    font-size: 12px;
    color: var(--ink-3);
    text-align: right;
    letter-spacing: 0.04em;
    min-width: fit-content;
  }

  /* ── TL;DR Banner ── */
  .tldr {
    background: var(--ink);
    color: var(--white);
    padding: clamp(20px, 3vw, 32px) clamp(16px, 5vw, 80px);
  }

  .tldr-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--red);
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .tldr-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: rgba(255,255,255,0.15);
    max-width: 80px;
  }

  .tldr-text {
    font-family: 'Playfair Display', serif;
    font-size: clamp(16px, 2.5vw, 22px);
    line-height: 1.55;
    color: rgba(255,255,255,0.93);
    max-width: 820px;
  }

  .tldr-text.loading {
    color: rgba(255,255,255,0.35);
    font-style: italic;
    font-size: 15px;
    font-family: 'Inter', sans-serif;
    animation: pulse 1.8s ease-in-out infinite;
  }

  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }

  /* ── Stats bar ── */
  .stats-bar {
    background: var(--white);
    border-bottom: 1px solid var(--border);
    padding: 10px clamp(16px, 5vw, 80px);
    display: flex;
    align-items: center;
    gap: 24px;
    flex-wrap: wrap;
  }

  .stat-pill {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--ink-3);
  }

  .stat-pill strong {
    color: var(--ink);
    font-weight: 600;
  }

  .stat-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--red);
    animation: blink 2s ease-in-out infinite;
  }

  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

  .refresh-btn {
    margin-left: auto;
    font-size: 11px;
    color: var(--ink-3);
    background: none;
    border: 1px solid var(--border);
    padding: 4px 10px;
    border-radius: 4px;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s;
    letter-spacing: 0.03em;
  }

  .refresh-btn:hover { color: var(--ink); border-color: var(--ink-3); }
  .refresh-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* ── Category Nav ── */
  .category-nav {
    background: var(--white);
    padding: 0 clamp(16px, 5vw, 80px);
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 0;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .category-nav::-webkit-scrollbar { display: none; }

  .cat-btn {
    padding: 12px 18px;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.03em;
    color: var(--ink-3);
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.15s;
    font-family: inherit;
    text-transform: uppercase;
    font-size: 11px;
    letter-spacing: 0.1em;
  }

  .cat-btn:hover { color: var(--ink); }

  .cat-btn.active {
    color: var(--ink);
    border-bottom-color: var(--red);
    font-weight: 600;
  }

  /* ── Main Content ── */
  .content {
    max-width: 1320px;
    margin: 0 auto;
    padding: 32px clamp(16px, 5vw, 80px) 60px;
  }

  /* ── Section header ── */
  .section-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 20px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 10px;
  }

  .section-title {
    font-family: 'Playfair Display', serif;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }

  .section-count {
    font-size: 12px;
    color: var(--ink-3);
  }

  /* ── Top Story (hero card) ── */
  .hero-card {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    box-shadow: var(--shadow);
    margin-bottom: 24px;
    display: flex;
    align-items: stretch;
    min-height: 160px;
    transition: box-shadow 0.2s;
  }

  .hero-card:hover { box-shadow: 0 4px 20px rgba(0,0,0,0.1); }

  .hero-accent {
    width: 6px;
    background: var(--red);
    flex-shrink: 0;
  }

  .hero-body {
    padding: 24px 28px;
    flex: 1;
  }

  .hero-meta {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }

  .hero-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--red);
    background: var(--red-light);
    padding: 2px 7px;
    border-radius: 3px;
  }

  .hero-title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(18px, 2.5vw, 26px);
    font-weight: 700;
    line-height: 1.3;
    color: var(--ink);
    text-decoration: none;
    display: block;
    margin-bottom: 10px;
    letter-spacing: -0.01em;
  }

  .hero-title:hover { color: var(--red); }

  .hero-desc {
    font-size: 14px;
    color: var(--ink-2);
    line-height: 1.6;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  /* ── News Grid ── */
  .news-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 16px;
    margin-bottom: 32px;
  }

  .article-card {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px;
    box-shadow: var(--shadow);
    transition: box-shadow 0.2s, transform 0.15s;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .article-card:hover {
    box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    transform: translateY(-1px);
  }

  .card-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .source-badge {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 2px 7px;
    border-radius: 3px;
  }

  .badge-World { background: #eff6ff; color: #1d4ed8; }
  .badge-Technology { background: #f0fdf4; color: #15803d; }
  .badge-Science { background: #fdf4ff; color: #7e22ce; }
  .badge-Business { background: #fff7ed; color: #c2410c; }
  .badge-default { background: #f9fafb; color: #374151; }

  .card-time {
    font-size: 11px;
    color: var(--ink-3);
    margin-left: auto;
  }

  .card-title {
    font-family: 'Playfair Display', serif;
    font-size: 16px;
    font-weight: 700;
    line-height: 1.4;
    color: var(--ink);
    text-decoration: none;
    letter-spacing: -0.01em;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
    flex: 1;
  }

  .card-title:hover { color: var(--red); }

  .card-desc {
    font-size: 13px;
    color: var(--ink-2);
    line-height: 1.55;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .card-footer {
    display: flex;
    align-items: center;
    gap: 8px;
    padding-top: 8px;
    border-top: 1px solid var(--border);
  }

  .card-source-name {
    font-size: 11px;
    color: var(--ink-3);
    flex: 1;
  }

  .card-read {
    font-size: 11px;
    font-weight: 500;
    color: var(--red);
    text-decoration: none;
    letter-spacing: 0.03em;
  }

  .card-read:hover { text-decoration: underline; }

  /* ── Load More ── */
  .load-more {
    text-align: center;
    padding-top: 8px;
  }

  .load-more-btn {
    display: inline-block;
    padding: 12px 32px;
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 6px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 500;
    color: var(--ink-2);
    cursor: pointer;
    transition: all 0.15s;
    letter-spacing: 0.04em;
  }

  .load-more-btn:hover { background: var(--ink); color: var(--white); border-color: var(--ink); }
  .load-more-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* ── Empty state ── */
  .empty {
    text-align: center;
    padding: 60px 0;
    color: var(--ink-3);
  }

  .empty h3 {
    font-family: 'Playfair Display', serif;
    font-size: 22px;
    margin-bottom: 8px;
    color: var(--ink-2);
  }

  /* ── Skeleton loaders ── */
  .skeleton {
    background: linear-gradient(90deg, #eeece8 25%, #e4e2de 50%, #eeece8 75%);
    background-size: 200% 100%;
    animation: shimmer 1.5s infinite;
    border-radius: 4px;
  }

  @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

  .skel-card {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  /* ── Footer ── */
  footer {
    text-align: center;
    padding: 20px;
    font-size: 12px;
    color: var(--ink-3);
    border-top: 1px solid var(--border);
    background: var(--white);
    letter-spacing: 0.03em;
  }

  /* ── Responsive ── */
  @media (max-width: 640px) {
    .masthead-tagline { display: none; }
    .masthead-date { font-size: 11px; }
    .news-grid { grid-template-columns: 1fr; }
    .stats-bar { gap: 14px; }
    .stat-pill:last-of-type { display: none; }
  }
</style>
</head>
<body>

<!-- ── Masthead ─────────────────────────────────────────────────────── -->
<header class="masthead">
  <div class="masthead-top">
    <div class="masthead-date" id="today-date"></div>
    <div class="masthead-logo">The <span>Brief</span></div>
    <div class="masthead-tagline">Curated · Concise · Clear</div>
  </div>
</header>

<!-- ── TL;DR ────────────────────────────────────────────────────────── -->
<div class="tldr">
  <div class="tldr-label">TL;DR · Top Lines</div>
  <p class="tldr-text loading" id="tldr-text">Loading today's briefing…</p>
</div>

<!-- ── Stats bar ────────────────────────────────────────────────────── -->
<div class="stats-bar">
  <div class="stat-pill">
    <span class="stat-dot"></span>
    <span>Live</span>
  </div>
  <div class="stat-pill">
    <strong id="stat-total">—</strong> stories
  </div>
  <div class="stat-pill">
    <strong id="stat-sources">—</strong> sources
  </div>
  <div class="stat-pill">
    Updated <strong id="stat-updated">—</strong>
  </div>
  <button class="refresh-btn" id="refresh-btn" title="Refresh feeds">↻ Refresh</button>
</div>

<!-- ── Category Nav ─────────────────────────────────────────────────── -->
<nav class="category-nav" id="cat-nav">
  <button class="cat-btn active" data-cat="All">All</button>
  <button class="cat-btn" data-cat="World">World</button>
  <button class="cat-btn" data-cat="Technology">Technology</button>
  <button class="cat-btn" data-cat="Science">Science</button>
  <button class="cat-btn" data-cat="Business">Business</button>
</nav>

<!-- ── Content ──────────────────────────────────────────────────────── -->
<main class="content">
  <div class="section-header">
    <span class="section-title" id="section-title">Latest Stories</span>
    <span class="section-count" id="section-count"></span>
  </div>

  <!-- Hero top story -->
  <div id="hero-slot"></div>

  <!-- Grid -->
  <div class="news-grid" id="news-grid"></div>

  <!-- Load more -->
  <div class="load-more" id="load-more-wrap" style="display:none">
    <button class="load-more-btn" id="load-more-btn">Load more stories</button>
  </div>
</main>

<footer>
  The Brief aggregates publicly available RSS feeds. Stories link to original sources. &copy; 2026
</footer>

<script>
// ── State ────────────────────────────────────────────────────────────────────
let currentCat = 'All';
let currentPage = 1;
let totalPages = 1;
let loading = false;

// ── Utilities ────────────────────────────────────────────────────────────────
function timeAgo(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr);
  if (isNaN(d)) return '';
  const diff = (Date.now() - d.getTime()) / 1000;
  if (diff < 60) return 'Just now';
  if (diff < 3600) return `${Math.floor(diff / 60)}m ago`;
  if (diff < 86400) return `${Math.floor(diff / 3600)}h ago`;
  return `${Math.floor(diff / 86400)}d ago`;
}

function formatDate(d) {
  return d.toLocaleDateString('en-US', { weekday:'long', year:'numeric', month:'long', day:'numeric' });
}

function badgeClass(cat) {
  const map = { World:'World', Technology:'Technology', Science:'Science', Business:'Business' };
  return 'badge-' + (map[cat] || 'default');
}

function escHtml(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Skeleton loaders ──────────────────────────────────────────────────────────
function renderSkeletons(n = 6) {
  document.getElementById('hero-slot').innerHTML = `
    <div class="hero-card">
      <div class="hero-accent"></div>
      <div class="hero-body" style="display:flex;flex-direction:column;gap:10px">
        <div class="skeleton" style="height:14px;width:80px"></div>
        <div class="skeleton" style="height:26px;width:75%"></div>
        <div class="skeleton" style="height:14px;width:60%"></div>
      </div>
    </div>`;
  const grid = document.getElementById('news-grid');
  grid.innerHTML = Array.from({length: n}, () => `
    <div class="skel-card">
      <div style="display:flex;gap:8px">
        <div class="skeleton" style="height:18px;width:70px"></div>
        <div class="skeleton" style="height:18px;width:40px;margin-left:auto"></div>
      </div>
      <div class="skeleton" style="height:20px;width:90%"></div>
      <div class="skeleton" style="height:20px;width:70%"></div>
      <div class="skeleton" style="height:13px;width:85%"></div>
      <div class="skeleton" style="height:13px;width:60%"></div>
    </div>`).join('');
}

// ── Render articles ───────────────────────────────────────────────────────────
function renderHero(a) {
  if (!a) { document.getElementById('hero-slot').innerHTML = ''; return; }
  document.getElementById('hero-slot').innerHTML = `
    <div class="hero-card">
      <div class="hero-accent"></div>
      <div class="hero-body">
        <div class="hero-meta">
          <span class="hero-label">Top Story</span>
          <span class="source-badge ${badgeClass(a.category)}">${escHtml(a.category)}</span>
          <span style="font-size:11px;color:var(--ink-3);margin-left:auto">${escHtml(a.source)} · ${timeAgo(a.fetched_at)}</span>
        </div>
        <a class="hero-title" href="${escHtml(a.link)}" target="_blank" rel="noopener">${escHtml(a.title)}</a>
        ${a.description ? `<p class="hero-desc">${escHtml(a.description)}</p>` : ''}
      </div>
    </div>`;
}

function renderCard(a) {
  return `
    <div class="article-card">
      <div class="card-meta">
        <span class="source-badge ${badgeClass(a.category)}">${escHtml(a.category)}</span>
        <span class="card-time">${timeAgo(a.fetched_at)}</span>
      </div>
      <a class="card-title" href="${escHtml(a.link)}" target="_blank" rel="noopener">${escHtml(a.title)}</a>
      ${a.description ? `<p class="card-desc">${escHtml(a.description)}</p>` : ''}
      <div class="card-footer">
        <span class="card-source-name">${escHtml(a.source)}</span>
        <a class="card-read" href="${escHtml(a.link)}" target="_blank" rel="noopener">Read →</a>
      </div>
    </div>`;
}

// ── Data fetching ─────────────────────────────────────────────────────────────
async function loadArticles(cat, page, append = false) {
  if (loading) return;
  loading = true;
  if (!append) renderSkeletons();

  try {
    const res = await fetch(`/api/articles?category=${encodeURIComponent(cat)}&page=${page}`);
    const data = await res.json();
    totalPages = data.pages;
    currentPage = data.page;

    const articles = data.articles;
    const label = cat === 'All' ? 'Latest Stories' : cat;
    document.getElementById('section-title').textContent = label;
    document.getElementById('section-count').textContent =
      data.total > 0 ? `${data.total.toLocaleString()} stories` : '';

    if (!append) {
      renderHero(articles[0] || null);
      const rest = articles.slice(1);
      document.getElementById('news-grid').innerHTML = rest.length
        ? rest.map(renderCard).join('')
        : (data.total === 0 ? `<div></div>` : '');
    } else {
      document.getElementById('news-grid').insertAdjacentHTML('beforeend', articles.map(renderCard).join(''));
    }

    if (data.total === 0 && !append) {
      document.getElementById('news-grid').innerHTML = `
        <div class="empty" style="grid-column:1/-1">
          <h3>No stories yet</h3>
          <p>Feeds are loading — check back in a moment.</p>
        </div>`;
      document.getElementById('hero-slot').innerHTML = '';
    }

    const loadMoreWrap = document.getElementById('load-more-wrap');
    const loadMoreBtn = document.getElementById('load-more-btn');
    if (data.page < data.pages) {
      loadMoreWrap.style.display = '';
      loadMoreBtn.disabled = false;
      loadMoreBtn.textContent = 'Load more stories';
    } else {
      loadMoreWrap.style.display = 'none';
    }
  } catch (e) {
    document.getElementById('news-grid').innerHTML = `<div class="empty" style="grid-column:1/-1"><h3>Could not load stories</h3><p>Please try again shortly.</p></div>`;
    document.getElementById('hero-slot').innerHTML = '';
  } finally {
    loading = false;
  }
}

async function loadSummary() {
  try {
    const res = await fetch('/api/summary');
    const d = await res.json();
    const el = document.getElementById('tldr-text');
    if (d.content) {
      el.textContent = d.content;
      el.classList.remove('loading');
    } else {
      el.textContent = 'Compiling today\'s briefing — check back shortly.';
    }
  } catch {
    document.getElementById('tldr-text').textContent = 'News feeds loading…';
  }
}

async function loadStats() {
  try {
    const res = await fetch('/api/stats');
    const d = await res.json();
    document.getElementById('stat-total').textContent = d.total?.toLocaleString() || '—';
    document.getElementById('stat-sources').textContent = d.sources || '—';
    if (d.last_updated) {
      const t = timeAgo(d.last_updated);
      document.getElementById('stat-updated').textContent = t || '—';
    }
  } catch {}
}

// ── Category nav ──────────────────────────────────────────────────────────────
document.querySelectorAll('.cat-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentCat = btn.dataset.cat;
    currentPage = 1;
    loadArticles(currentCat, 1, false);
  });
});

// ── Load more ─────────────────────────────────────────────────────────────────
document.getElementById('load-more-btn').addEventListener('click', async () => {
  const btn = document.getElementById('load-more-btn');
  btn.disabled = true;
  btn.textContent = 'Loading…';
  await loadArticles(currentCat, currentPage + 1, true);
});

// ── Refresh ───────────────────────────────────────────────────────────────────
const refreshBtn = document.getElementById('refresh-btn');
refreshBtn.addEventListener('click', async () => {
  refreshBtn.disabled = true;
  refreshBtn.textContent = '↻ Refreshing…';
  try {
    await fetch('/api/refresh', { method: 'POST' });
    await new Promise(r => setTimeout(r, 3000));
    await Promise.all([loadArticles(currentCat, 1), loadSummary(), loadStats()]);
  } catch {}
  refreshBtn.disabled = false;
  refreshBtn.textContent = '↻ Refresh';
});

// ── Date ──────────────────────────────────────────────────────────────────────
document.getElementById('today-date').textContent = formatDate(new Date());

// ── Init ──────────────────────────────────────────────────────────────────────
Promise.all([
